---
name: Build and Release OpenWrt

# One file: release needs the same build the push job runs, and as two
# workflows both had to declare build-openwrt.

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
    tags:
      - 'rc-*'
      - 'release-*'
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-openwrt:
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: x86_64
            openwrt_branch: dev
          # ALFA Network AP120C (ath79/generic), ported on top of
          # openwrt-25.12 in the fork's ap120c branch.
          - flavour: ap120c
            openwrt_branch: ap120c
          # MikroTik hAP ac / RB962UiGS-5HacT2HnT (ath79/mikrotik), supported
          # upstream; built from the same 25.12-based branch.
          - flavour: hap-ac
            openwrt_branch: ap120c
    uses: bbusse/github-workflows/.github/workflows/build-openwrt.yml@dev
    with:
      flavour: ${{ matrix.flavour }}
      openwrt_branch: ${{ matrix.openwrt_branch }}
      artifact_name: openwrt

  release:
    needs:
      - build-openwrt
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    uses: bbusse/github-workflows/.github/workflows/release.yml@dev
    with:
      artifact_name: openwrt
      binary_name: openwrt
      release_branch: main
    secrets: inherit
