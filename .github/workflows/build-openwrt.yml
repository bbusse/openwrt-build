---
name: Build and Release OpenWrt

# One file: release needs the same build the push job runs, and as two
# workflows both had to declare build-openwrt.

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
    tags:
      - 'rc-*'
      - 'release-*'
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-openwrt:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every flavour builds from the fork's dev branch: upstream
          # openwrt-25.12 plus the AP120C port and the hAP ac switch fix.
          - flavour: x86_64
            openwrt_branch: dev
          # ALFA Network AP120C (ath79/generic).
          - flavour: ap120c
            openwrt_branch: dev
          # MikroTik hAP ac / RB962UiGS-5HacT2HnT (ath79/mikrotik), supported
          # upstream.
          - flavour: hap-ac
            openwrt_branch: dev
          # Generic arm64 VM image (armsr/armv8, EFI), the aarch64 counterpart
          # of x86_64.
          - flavour: arm64
            openwrt_branch: dev
          # BeagleBone Black (omap/generic), SD card image with U-Boot,
          # supported upstream.
          - flavour: beaglebone-black
            openwrt_branch: dev
    uses: bbusse/github-workflows/.github/workflows/build-openwrt.yml@dev
    with:
      flavour: ${{ matrix.flavour }}
      openwrt_branch: ${{ matrix.openwrt_branch }}
      artifact_name: openwrt
    # Passes OPENWRT_APK_PRIVATE_KEY (package signing key) when set.
    secrets: inherit

  release:
    needs:
      - build-openwrt
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    uses: bbusse/github-workflows/.github/workflows/release.yml@dev
    with:
      artifact_name: openwrt
      binary_name: openwrt
      release_branch: main
    secrets: inherit
